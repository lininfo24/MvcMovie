name: Playwright Browser UI Testing

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read

jobs:
    browser-scans:
        name: Run Headless UI Gates
        runs-on: ubuntu-latest

        # A. SPIN UP A REAL, ISOLATED SQL SERVER INSTANCE IN THE RUNNER BACKGROUND
        services:
            mssql:
                image: mcr.microsoft.com/mssql/server:2022-latest
                ports:
                    - 1433:1433
                env:
                    ACCEPT_EULA: "Y"
                    MSSQL_SA_PASSWORD: "YourSecurePassword123!"

        steps:
            # 1. Pull down your repository code
            - name: Checkout Code
              uses: actions/checkout@v4

            # 2. Set up the matching .NET SDK matching your codebase
            - name: Setup .NET Core
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            # 3. Restore and compile the solution architecture
            - name: Compile Solution
              run: dotnet build MvcMovie.sln --configuration Release

            # 4. Install the specialized Playwright CLI tool and internal Chromium binaries
            - name: Install Playwright Linux Browsers
              run: |
                  dotnet tool install --global Microsoft.Playwright.CLI
                  playwright install --with-deps chromium

            # NEW: Give the background SQL Server container 15 seconds to finish its boot sequence
            - name: Wait for SQL Server Container Initialization
              run: sleep 60

            # 5. CRUCIAL: Launch your actual web application in the background of the runner server
            # B. LAUNCH THE WEB SERVER FORCED TO CONNECT TO THE SQL SERVER CONTAINER VIA OVERRIDE
            # The trailing ampersand (&) forces Linux to run the server silently behind the scenes
            - name: Launch App Web Server in Background
              run: dotnet run --project MvcMovie/MvcMovie.csproj --configuration Release --no-build &
              env:
                  ASPNETCORE_URLS: http://localhost:8080
                  ASPNETCORE_ENVIRONMENT: Development
                  ConnectionStrings__MvcMovieContext: "Server=localhost,1433;Database=E2EMovieTestDb;User Id=sa;Password=YourSecurePassword123!;TrustServerCertificate=True;"

            # 6. EXECUTE EXCLUSIVELY THE UI INTERACTION TESTS
            - name: Execute Playwright Test Suite
              run: dotnet test MvcMovie.Tests/MvcMovie.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~UiTests"
