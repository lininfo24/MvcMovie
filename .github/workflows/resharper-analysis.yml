name: ReSharper Code Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  inspect-code:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup .NET SDK (matches your application version)
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x # Change to 6.0.x or 9.0.x depending on your app

      # 3. Create a tool manifest and install ReSharper locally
      - name: Install ReSharper CLI Tools
        run: |
          dotnet new tool-manifest
          dotnet tool install JetBrains.ReSharper.GlobalTools

      # 4. Restore dependencies and local tools
      - name: Restore Dependencies and Tools
        run: |
          dotnet restore
          dotnet tool restore

      # 5. Run ReSharper and output SARIF format instead of XML
      - name: Run ReSharper InspectCode
        run: dotnet tool run jb inspectcode MvcMovie.sln --output=resharper-report.sarif --severity=SUGGESTION

      # 6. Upload the SARIF file directly to GitHub Security Alerts
      - name: Upload SARIF to GitHub Code Scanning
        uses: github/code-scanning-upload-mixin@v3 # Note: Standard action is github/code-scanning-upload-action@v3
        with:
          sarif_file: resharper-report.sarif
