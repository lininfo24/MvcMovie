name: .NET Code Style & Formatting Compliance

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read

jobs:
    format-gatekeeper:
        name: Verify Code Layout Compliance
        runs-on: ubuntu-latest

        steps:
            # 1. Pull down the repository source files
            - name: Checkout Code
              uses: actions/checkout@v4

            # 2. Setup the target .NET SDK framework engine
            - name: Setup .NET Core
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: 8.0.x

            # 3. Restore the application dependencies
            - name: Restore Project Dependencies
              run: dotnet restore MvcMovie.sln

            # 4. Enforce structural layout configurations defined in the root .editorconfig
            # This executes lightning-fast and stops processing instantly if errors occur
            - name: Enforce Style Specifications
              run: dotnet format --verify-no-changes
